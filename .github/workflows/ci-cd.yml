name: CI/CD Pipeline - Backend Eventos

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        run: npm test

  deploy:
    name: Despliegue en Azure App Service (CD)
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de producción
        run: npm ci --omit=dev

      - name: Desplegar en Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'eventos-backend-fisi' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Smoke Test (Requisito EARS - TEO_08 Diapo 4)
        run: |
          APP_URL="${{ steps.deploy-to-webapp.outputs.webapp-url || vars.BACKEND_URL }}"
          if [ -n "$APP_URL" ]; then
            echo "Ejecutando smoke test en $APP_URL/health..."
            curl --fail --retry 5 --retry-delay 5 "$APP_URL/health" || exit 1
          else
            echo "Variable APP_URL no configurada aún; smoke test omitido hasta configurar secrets."
          fi
